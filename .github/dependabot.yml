version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    ignore:
      # Owned by the gh aw CLI, not Dependabot: a hand-bumped setup pin drifts from the
      # compiled .lock.yml files and actions-lock.json and fails at runtime with
      # `Cannot find module`. Move it with `gh extension upgrade aw && gh aw compile`.
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm dependencies (if any added in future)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
