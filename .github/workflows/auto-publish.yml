name: Auto Publish

on:
  push:
    branches:
      - main
    paths:
      - 'extensions/**'
      - 'templates/**'
      - 'brands/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: "32a7f876-b319-4703-be8c-f45654b3ad13"
  AZURE_TENANT_ID: "38fcc012-5a88-4df9-b912-44ad0ee73268"
  AZURE_SUBSCRIPTION_ID: "42fa28b4-93f8-496e-8093-53417e5be8bf"
  KEY_VAULT_NAME: "lucidhub-kv-dev"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      extensions: ${{ steps.detect.outputs.extensions }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Detect changed extensions
      id: detect
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        all_extensions() {
          find extensions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(. != ""))'
        }

        # Manual dispatch: publish all extensions
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          EXTENSIONS=$(all_extensions)
          echo "extensions=${EXTENSIONS}" >> "$GITHUB_OUTPUT"
          echo "reason=dispatch" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Diff the whole pushed range (before..HEAD), not just the last commit,
        # so a trailing housekeeping commit can't mask earlier changes. Fall
        # back to the last commit if the before-SHA is absent or unreachable
        # (new branch, force-push, or shallow history).
        if [ -n "$BEFORE_SHA" ] \
          && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
          && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD)
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi

        # If templates or brands changed, publish all extensions
        if echo "$CHANGED_FILES" | grep -qE '^(templates/|brands/)'; then
          EXTENSIONS=$(all_extensions)
          echo "extensions=${EXTENSIONS}" >> "$GITHUB_OUTPUT"
          echo "reason=templates" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Otherwise, only publish extensions with changes
        EXTENSIONS=$(echo "$CHANGED_FILES" | grep '^extensions/' | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
        if [ "$EXTENSIONS" = "[]" ] || [ -z "$EXTENSIONS" ]; then
          echo 'extensions=[]' >> "$GITHUB_OUTPUT"
        else
          echo "extensions=${EXTENSIONS}" >> "$GITHUB_OUTPUT"
        fi
        echo "reason=extensions" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.extensions != '[]'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install vsce
      run: npm install -g @vscode/vsce

    - name: Azure Login (OIDC)
      uses: azure/login@v3
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Allow runner access to Key Vault
      id: firewall
      run: |
        # Two independent providers so one outage can't block the whole publish.
        RUNNER_IP=$(curl -sf --max-time 10 https://api.ipify.org || curl -sf --max-time 10 https://ifconfig.me/ip)
        if ! echo "$RUNNER_IP" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
          echo "::error::Could not determine runner IP (got: '$RUNNER_IP')"
          exit 1
        fi
        echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
        az keyvault network-rule add --name "${{ env.KEY_VAULT_NAME }}" --ip-address "$RUNNER_IP/32" --only-show-errors
        sleep 10

    - name: Get VSCE PAT from Key Vault
      id: keyvault
      run: |
        VSCE_PAT=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT_NAME }}" --name "vsce-marketplace-pat" --query "value" -o tsv)
        echo "::add-mask::$VSCE_PAT"
        echo "VSCE_PAT=$VSCE_PAT" >> "$GITHUB_ENV"

    - name: Remove runner access from Key Vault
      if: always() && steps.firewall.outputs.runner_ip != ''
      run: |
        az keyvault network-rule remove --name "${{ env.KEY_VAULT_NAME }}" --ip-address "${{ steps.firewall.outputs.runner_ip }}/32" --only-show-errors

    - name: Publish extensions
      env:
        EXTENSIONS_JSON: ${{ needs.detect-changes.outputs.extensions }}
        REASON: ${{ needs.detect-changes.outputs.reason }}
      run: |
        EXTENSIONS="$EXTENSIONS_JSON"
        FAILED=""
        PUBLISHED_NEW=""
        SKIPPED=""

        for ext in $(echo "$EXTENSIONS" | jq -r '.[]'); do
          echo "::group::Publishing $ext"

          VERSION=$(node -p "require('./extensions/$ext/package.json').version")
          echo "Version: $VERSION"

          # Copy brand assets
          [ -f "brands/$ext/icon.png" ] && cp "brands/$ext/icon.png" "extensions/$ext/icon.png"
          [ -f "brands/$ext/README.md" ] && cp "brands/$ext/README.md" "extensions/$ext/README.md"

          # Package
          (cd "extensions/$ext" && vsce package)

          # Publish with retry
          PUBLISHED=false
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            PUBLISH_OUTPUT=$( (cd "extensions/$ext" && vsce publish -p "$VSCE_PAT") 2>&1) && {
              echo "$ext v$VERSION published successfully!"
              PUBLISHED_NEW="$PUBLISHED_NEW $ext"
              PUBLISHED=true
              break
            }
            echo "$PUBLISH_OUTPUT"
            if echo "$PUBLISH_OUTPUT" | grep -q "already exists"; then
              echo "$ext v$VERSION already published — skipping."
              SKIPPED="$SKIPPED $ext"
              PUBLISHED=true
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          if [ "$PUBLISHED" = "false" ]; then
            echo "::error::Failed to publish $ext after 3 attempts"
            FAILED="$FAILED $ext"
          fi

          echo "::endgroup::"

          # Brief pause between extensions to avoid rate limits
          sleep 5
        done

        echo ""
        echo "=== Summary ==="
        [ -n "$PUBLISHED_NEW" ] && echo "Published:$PUBLISHED_NEW"
        [ -n "$SKIPPED" ] && echo "Skipped (already published):$SKIPPED"
        [ -n "$FAILED" ] && echo "Failed:$FAILED"

        # A templates/brands change republishes everything — if every version
        # already existed, the change reached nobody. Run `npm run bump` and
        # push to actually ship it.
        if [ "$REASON" = "templates" ] && [ -z "$PUBLISHED_NEW" ] && [ -z "$FAILED" ]; then
          echo "::warning::Templates or brands changed but every extension version already exists on the marketplace — nothing shipped. Bump versions (npm run bump -- --minor -m \"...\") and push."
        fi

        [ -n "$FAILED" ] && exit 1
        echo "Done."
