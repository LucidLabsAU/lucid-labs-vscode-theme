# Microsoft Security DevOps (MSDO) integrates static analysis tools into the development cycle.
# https://github.com/microsoft/security-devops-action

name: "Microsoft Defender For Devops"

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 16 * * 5'

jobs:
  MSDO:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          6.0.x
          8.0.x
    - name: Run Microsoft Security DevOps
      uses: microsoft/security-devops-action@5b26a185ff02cf7c100778adeff0ebbf704ca144 # v1
      id: msdo
    - name: Upload results to Security tab
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}
